<nav class="navbar navbar-expand-lg navbar-dark bg-marca sticky-top shadow">
  <div class="container">
    <a class="navbar-brand fw-bold d-flex align-items-center gap-2" routerLink="/inicio">
      <span class="badge-icono"><i class="bi bi-hospital-fill"></i></span>
      <span>Hospital Dr. Santo</span>
    </a>

    <button
      class="navbar-toggler"
      type="button"
      (click)="alternarMenu()"
      [attr.aria-expanded]="!menuCerrado()"
      aria-label="Abrir o cerrar menú"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="navbar-collapse collapse" [class.show]="!menuCerrado()">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center">
        @for (enlace of enlaces; track enlace.ruta) {
          <li class="nav-item">
            <a
              class="nav-link"
              [routerLink]="enlace.ruta"
              routerLinkActive="activo"
              [routerLinkActiveOptions]="{ exact: enlace.ruta === '/inicio' }"
              (click)="cerrarMenu()"
            >
              {{ enlace.texto }}
            </a>
          </li>
        }
        <li class="nav-item ms-lg-3">
          <a class="btn btn-cta btn-sm px-3 rounded-pill" routerLink="/contacto" (click)="cerrarMenu()">
            <i class="bi bi-calendar2-check me-1"></i> Pedir cita
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>
